<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firdaws Jewels Contact Us</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contactus.css">
</head>
<body>
     <header class="hero-section" id="contact-hero-section">
<nav class="navbar">
    <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../index.html#about-us">About Us</a></li>
        <li><a href="contactus.html" class="active">Contact Us</a></li>
    </ul>
</nav>
<div class="contactus-heading">
<h1>Contact Us</h1>
</div>
</header>
<main>
<div class="contact-details-container">
    <section class="contact-details">
        <h2>Contact Details</h2>
        <div>
               <p>contact@firdawsjewels.com</p>
        <p>(+234) 009 104 103 13</p>
        </div>

        <div>
            <address><span class="bolder">Central HQ</span> 
        </address>
            <address>123 Avenue street</address>
            <address>City Township, CA 12345</address>
        </div>
     
    </section>
    <section class="contact-form">
        <h2>Online Enquiry</h2>
        <form>
            <div class="form-section">
                <label for="name">Name:</label>
                <input id="name" type="text" autocomplete="on" placeholder="e.g John Smith">
            </div>
            <div class="form-section">
                <label for="email">Email:</label>
                <input id="email" type="email" placeholder="e.g name@domain.com" autocomplete="on" required>
            </div>
            <div class="message-container">
                <label for="message">Message:</label>
                <textarea id="message" rows="5" required>
                </textarea>
            </div>
            <div class="button-container">
                <button type="submit" class="submit">Submit</button>
                <button type="reset" class="reset">Reset</button>
            </div>
        </form>
    </section>
</div>
</main>
 <footer class="footer-content">
        <p>Copyright Firdaws Jewels 2026. Developed by Firdaws Lamidi.</p>

    </footer>
</body>
</html>
